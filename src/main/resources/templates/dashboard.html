<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Task Manager</span>
        <div>
            <span class="text-white me-3" th:text="${user.username}"></span>
            <!-- th:action so the CSRF token is added automayically -->
            <form method="post" th:action="@{/logout}" class="d-inline">
                <button class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <!-- show validation error message after redirect, e.g, empty project name  -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card mb-4">
        <div class="card-body">
            <h5>Create New Project</h5>
            <!-- th:action so the CSRF token is added automayically; form fields are bound to ProjectForm and validated -->
            <form method="post" th:action="@{/projects/create}">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" name="name" class="form-control" placeholder="Project name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="description" class="form-control" placeholder="Description">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Create</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">My Projects</h4>
        <form method="get" th:action="@{/dashboard}" class="d-flex gap-2">
            <select name="sortBy" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="name" th:selected="${sortBy == 'name'}">Sort by name</option>
                <option value="createdAt" th:selected="${sortBy == 'createdAt'}">Sort by date created</option>
            </select>
            <select name="direction" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="asc" th:selected="${direction == 'asc'}">Ascending</option>
                <option value="desc" th:selected="${direction == 'desc'}">Descending</option>
            </select>
        </form>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="project : ${projectPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${project.name}"></h5>
                    <p class="card-text text-muted" th:text="${project.description}"></p>
                    <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-primary btn-sm">Open</a>
                    <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" class="d-inline">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${projectPage.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${projectPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/dashboard(page=${projectPage.number - 1}, sortBy=${sortBy}, direction=${direction})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${projectPage.number + 1} + ' / ' + ${projectPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${projectPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/dashboard(page=${projectPage.number + 1}, sortBy=${sortBy}, direction=${direction})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
