<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Task Manager</span>
        <div>
            <span class="text-white me-3" th:text="${user.username}"></span>
            <form method="post" action="/logout" class="d-inline">
                <button class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card mb-4">
        <div class="card-body">
            <h5>Create New Project</h5>
            <form method="post" action="/projects/create">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" name="name" class="form-control" placeholder="Project name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="description" class="form-control" placeholder="Description">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Create</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <h4>My Projects</h4>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="project : ${projects}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${project.name}"></h5>
                    <p class="card-text text-muted" th:text="${project.description}"></p>
                    <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-primary btn-sm">Open</a>
                    <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" class="d-inline">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
