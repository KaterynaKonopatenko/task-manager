<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Task Manager</span>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
</nav>

<div class="container">
    <h2 th:text="${project.name}"></h2>
    <p class="text-muted" th:text="${project.description}"></p>
    <!-- show validation error message after redirect, e.g, empty task title  -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Add New Task</h5>
            <!-- th:action so the CSRF token is added automayically; form fields are bound to TaskForm and validated -->
            <form method="post" th:action="@{/tasks/create}">
                <input type="hidden" name="projectId" th:value="${project.id}">
                <div class="row g-2">
                    <div class="col-md-2">
                        <input type="text" name="title" class="form-control" placeholder="Task title" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="description" class="form-control" placeholder="Description">
                    </div>
                    <div class="col-md-2">
                        <select name="priority" class="form-control">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" name="dueDate" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Add Task</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Tasks</h4>
        <form method="get" th:action="@{/projects/{id}(id=${project.id})}" class="d-flex gap-2">
            <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="" th:selected="${status == null or status == ''}">All statuses</option>
                <option value="TODO" th:selected="${status == 'TODO'}">To Do</option>
                <option value="IN_PROGRESS" th:selected="${status == 'IN_PROGRESS'}">In Progress</option>
                <option value="DONE" th:selected="${status == 'DONE'}">Done</option>
            </select>
            <select name="sortBy" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="createdAt" th:selected="${sortBy == 'createdAt'}">Sort by date created</option>
                <option value="dueDate" th:selected="${sortBy == 'dueDate'}">Sort by due date</option>
                <option value="title" th:selected="${sortBy == 'title'}">Sort by title</option>
                <option value="priority" th:selected="${sortBy == 'priority'}">Sort by priority</option>
            </select>
            <select name="direction" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="asc" th:selected="${direction == 'asc'}">Ascending</option>
                <option value="desc" th:selected="${direction == 'desc'}">Descending</option>
            </select>
        </form>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="task : ${taskPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${task.title}"></h5>
                    <p class="card-text" th:text="${task.description}"></p>
                    <span class="badge bg-secondary" th:text="${task.status}"></span>
                    <span class="badge bg-warning text-dark" th:text="${task.priority}"></span>
                    <div class="mt-2">
                        <a th:href="@{/tasks/{id}(id=${task.id})}" class="btn btn-primary btn-sm">Open</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${taskPage.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${taskPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/projects/{id}(id=${project.id}, page=${taskPage.number - 1}, sortBy=${sortBy}, direction=${direction}, status=${status})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${taskPage.number + 1} + ' / ' + ${taskPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${taskPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/projects/{id}(id=${project.id}, page=${taskPage.number + 1}, sortBy=${sortBy}, direction=${direction}, status=${status})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
