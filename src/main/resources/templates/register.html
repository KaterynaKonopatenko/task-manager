<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Register</h3>

                    <!-- show error if username or email already exists -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form method="post" th:action="@{/register}" th:object="${registerForm}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" required>
                            <!-- show validation error for username -->
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger small"
                                 th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                            <!-- show validation error for email -->
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                            <!-- show validation error for password -->
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small"
                                 th:errors="*{password}"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>
                    <p class="text-center mt-3">Already have account? <a href="/login">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
