<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Task Manager</span>
        <a th:href="@{/projects/{id}(id=${task.project.id})}" class="btn btn-outline-light btn-sm">Back to Project</a>
    </div>
</nav>

<div class="container">
    <div class="card mb-4">
        <div class="card-body">
            <h2 th:text="${task.title}"></h2>
            <p th:text="${task.description}"></p>
            <span class="badge bg-warning text-dark" th:text="${task.priority}"></span>
            <p th:if="${task.dueDate}" class="text-muted mt-2" >Due: <span th:text="${#temporals.format(task.dueDate,'dd.MM.yyyy')}"></span></p>

            <form method="post" th:action="@{/tasks/{id}/status(id=${task.id})}" class="mt-3">
                <div class="row g-2">
                    <div class="col-md-4">
                        <select name="status" class="form-control">
                            <option value="TODO" th:selected="${task.status == T(com.example.taskmanager.model.TaskStatus).TODO}">To Do</option>
                            <option value="IN_PROGRESS" th:selected="${task.status == T(com.example.taskmanager.model.TaskStatus).IN_PROGRESS}">In Progress</option>
                            <option value="DONE" th:selected="${task.status == T(com.example.taskmanager.model.TaskStatus).DONE}">Done</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Update</button>
                    </div>
                </div>
            </form>

            <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}" class="mt-2">
                <button class="btn btn-danger btn-sm">Delete Task</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5>Comments</h5>
            <div th:each="comment : ${comments}" class="border-bottom py-2 d-flex justify-content-between align-items-start">
                <div>
                    <strong th:text="${comment.user.username}"></strong>
                    <p th:text="${comment.text}"></p>
                </div>
                <form method="post" th:action="@{/tasks/{taskId}/comments/{commentId}/delete(taskId=${task.id},commentId=${comment.id})}">
                    <button class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
            </div>

            <form method="post" th:action="@{/tasks/{id}/comment(id=${task.id})}" class="mt-3">
                <div class="input-group">
                    <input type="text" name="text" class="form-control" placeholder="Write a comment..." required>
                    <button class="btn btn-primary">Post</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
